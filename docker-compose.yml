services:
  postgres:
    image: postgres:16-alpine
    container_name: gpdash-postgres
    environment:
      POSTGRES_DB: gpdash
      POSTGRES_USER: gpdash
      POSTGRES_PASSWORD: gpdash_dev
    ports:
      - "${GPDASH_PORT_DB:-10310}:5432"
    volumes:
      - ${SSD_DATA}/gpdash/postgres:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpdash"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gpdash-server
    environment:
      DATABASE_URL: postgresql://gpdash:gpdash_dev@postgres:5432/gpdash
      API_PORT: "3002"
      API_HOST: "0.0.0.0"
      NODE_ENV: production
    ports:
      - "${GPDASH_PORT_SERVER:-10311}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: [prod]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${GPDASH_PORT_SERVER:-10311}/api
    container_name: gpdash-frontend
    ports:
      - "${GPDASH_PORT_FRONTEND:-10313}:80"
    depends_on:
      - server
    restart: unless-stopped
