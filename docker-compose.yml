services:
  postgres:
    image: postgres:16-alpine
    container_name: gpdash-postgres
    environment:
      POSTGRES_DB: gpdash
      POSTGRES_USER: gpdash
      POSTGRES_PASSWORD: gpdash_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpdash"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
